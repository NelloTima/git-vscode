{% extends "base.html" %}
{% block title %}Gestão · {{ brand.name }}{% endblock %}
{% block content %}
<section class="wrap narrow section">
  <h1>Área de gestão</h1>
  <form class="card form" method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label class="f"><span>Senha</span><input type="password" name="senha" required autocomplete="current-password"></label>
    <button class="btn primary full" type="submit">Entrar</button>
  </form>
</section>
{% endblock %}
